<title>MCH Labs — Games</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
         background: radial-gradient(120% 90% at 50% 0%, #1b2150 0%, #0d1030 55%, #080a20 100%);
         color:#e8ecff; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  main { max-width: 720px; width:100%; padding: 56px 24px 40px; }
  h1 { font-size: 2.6rem; letter-spacing:.06em; text-align:center;

       background-clip:text; color:transparent; }
  p.tag { text-align:center; color:#9aa3cc; margin:10px 0 42px; }
  .game { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);

          display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .game b { font-size:1.15rem; }
  .game span { color:#9aa3cc; font-size:.92rem; display:block; margin-top:4px; }
  .game a { color:#8fb7ff; font-size:.9rem; text-decoration:none; white-space:nowrap; }
  .game a:hover { text-decoration:underline; }
  .soon { opacity:.55; }
  footer { color:#6b7399; font-size:.85rem; padding: 18px 24px 36px; text-align:center; }
  footer a { color:#8fb7ff; text-decoration:none; }
</style>
